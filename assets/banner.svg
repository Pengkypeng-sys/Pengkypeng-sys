<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="1" stop-color="#0b1a33"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36bcf7"/>
      <stop offset=".5" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#c084fc"/>
      <animate attributeName="x1" values="0;-1;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0;1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f6feb" stop-opacity=".9"/>
      <stop offset="1" stop-color="#c084fc" stop-opacity=".9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f6feb" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- floating orbs -->
  <circle cx="200" cy="80" r="110" fill="#1f6feb" opacity=".35" filter="url(#blur)">
    <animate attributeName="cx" values="200;320;200" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="220" r="120" fill="#c084fc" opacity=".28" filter="url(#blur)">
    <animate attributeName="cy" values="220;120;220" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="40" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="30" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="70" r="1.8"><animate attributeName="opacity" values="1;.3;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="25" r="1.3"><animate attributeName="opacity" values=".3;1;.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="50" r="1.6"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="200" r="1.2"><animate attributeName="opacity" values=".2;1;.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="40" cy="190" r="1.4"><animate attributeName="opacity" values="1;.3;1" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- left: identity -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="85" fill="#7d8590" font-size="16" letter-spacing="4">HELLO WORLD, I'M</text>
    <text x="66" y="160" fill="url(#txt)" font-size="78" font-weight="800" letter-spacing="2" filter="url(#glow)">FERIMAN</text>
    <text x="70" y="198" fill="#c9d1d9" font-size="22">Full Stack Developer · IT Staff</text>
  </g>
  <g font-family="Consolas, 'Courier New', monospace" font-size="17">
    <text x="70" y="240"><tspan fill="#3fb950">feri@alfakhir</tspan><tspan fill="#c9d1d9">:</tspan><tspan fill="#36bcf7">~</tspan><tspan fill="#c9d1d9">$ npm run build-the-future </tspan><tspan fill="#36bcf7">▋<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- right: terminal window art -->
  <g transform="translate(760 48)">
    <animateTransform attributeName="transform" type="translate" values="760 48;760 38;760 48" dur="5s" repeatCount="indefinite"/>
    <rect width="360" height="200" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect width="360" height="34" rx="14" fill="#161b22"/>
    <rect y="20" width="360" height="14" fill="#161b22"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="17" r="6" fill="#27c93f"/>
    <text x="180" y="22" fill="#7d8590" font-family="Consolas, monospace" font-size="12" text-anchor="middle">app.tsx</text>
    <g font-family="Consolas, 'Courier New', monospace" font-size="14">
      <text x="20" y="62"><tspan fill="#ff7b72">const</tspan><tspan fill="#c9d1d9"> dev = </tspan><tspan fill="#d2a8ff">{</tspan></text>
      <text x="40" y="86"><tspan fill="#79c0ff">stack</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"Next · Nest · Flutter"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="40" y="110"><tspan fill="#79c0ff">infra</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"CCNA · AWS"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="40" y="134"><tspan fill="#79c0ff">coffee</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#ffa657">Infinity</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="20" y="158" fill="#d2a8ff">};</text>
      <text x="20" y="182"><tspan fill="#8b949e">// shipping... </tspan><tspan fill="#3fb950">✔ ready</tspan>
        <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.4;.5;1" dur="4s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>

  <!-- floating symbols -->
  <g font-family="Consolas, monospace" font-weight="700" filter="url(#glow)">
    <text x="690" y="70" fill="#36bcf7" font-size="26" opacity=".8">&lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="1140" y="285" fill="#c084fc" font-size="24" opacity=".8">{ }
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="700" y="260" fill="#3fb950" font-size="20" opacity=".7">#!
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="4.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- bottom wave -->
  <path fill="url(#wave)" opacity=".35" d="M0 290C200 270 400 310 600 290S1000 270 1200 290V320H0Z">
    <animate attributeName="d" dur="7s" repeatCount="indefinite"
      values="M0 290C200 270 400 310 600 290S1000 270 1200 290V320H0Z;
              M0 295C200 312 400 275 600 295S1000 312 1200 295V320H0Z;
              M0 290C200 270 400 310 600 290S1000 270 1200 290V320H0Z"/>
  </path>
  <path fill="url(#wave)" d="M0 305C250 290 450 318 700 305S1050 292 1200 305V320H0Z">
    <animate attributeName="d" dur="5s" repeatCount="indefinite"
      values="M0 305C250 290 450 318 700 305S1050 292 1200 305V320H0Z;
              M0 308C250 318 450 294 700 308S1050 318 1200 308V320H0Z;
              M0 305C250 290 450 318 700 305S1050 292 1200 305V320H0Z"/>
  </path>
</svg>
